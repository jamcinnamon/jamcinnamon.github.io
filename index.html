<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현재 상황 | yeonly.me</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #e6edf3;
      margin-bottom: 0.4rem;
    }

    .handle {
      color: #58a6ff;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 0.75rem;
      margin-top: 1.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 20px;
      padding: 0.4rem 0.9rem;
      font-size: 0.9rem;
      color: #d1d5db;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .items li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .items li::before {
      content: '▸';
      color: #58a6ff;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .links {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    .links a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.35rem 0.8rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .links a:hover {
      border-color: #58a6ff;
      color: #a5d6ff;
    }

    .footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid #21262d;
      font-size: 0.8rem;
      color: #6e7681;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🍂</div>

    <h1>jamcinnamon</h1>
    <div class="handle">yeonly.me</div>

    <div class="section-title">현재 상황</div>
    <div class="status-badge">
      <span class="dot"></span>
      사이트 구축 중
    </div>

    <div class="section-title">지금 하고 있는 것</div>
    <ul class="items">
      <li>GitHub Pages 개인 사이트 세팅 중</li>
      <li>커스텀 도메인 (yeonly.me) 연결 완료</li>
      <li>콘텐츠 준비 중</li>
    </ul>

    <div class="section-title">링크</div>
    <div class="links">
      <a href="https://github.com/jamcinnamon" target="_blank" rel="noopener">GitHub</a>
    </div>

    <div class="footer">
      마지막 업데이트: 2026년 3월
    </div>
  </div>
</body>
</html>
